databases:
  # Dedicated HireNest Australia database — completely separate from TalentVault.
  - name: hirenest-australia-db
    databaseName: hirenest_australia
    user: hirenest_user
    plan: starter

services:
  - type: web
    name: hirenest-australia
    runtime: python
    plan: starter
    # Run build.sh via bash: the script is committed as mode 100644, so a bare
    # "./build.sh" is not executable and the build (including migrations) would
    # not run.
    buildCommand: bash build.sh
    # Apply migrations against the production database on every deploy, before
    # the new version starts receiving traffic.
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SITE_URL
        value: https://hirenest.com.au
      - key: SITE_NAME
        value: HireNest Australia
      - key: ALLOWED_HOSTS
        value: hirenest.com.au,www.hirenest.com.au,.hirenest.com.au,.onrender.com,localhost,127.0.0.1
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hirenest.com.au,https://www.hirenest.com.au,http://hirenest.com.au,http://www.hirenest.com.au,https://*.onrender.com,http://localhost:8002,http://127.0.0.1:8002
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # HireNest uses its OWN database connection string. It must NOT reuse
      # TalentVault's DATABASE_URL.
      - key: HIRENEST_DATABASE_URL
        fromDatabase:
          name: hirenest-australia-db
          property: connectionString
      - key: TALENTVAULT_RECRUITER_WORKSPACE_URL
        value: https://talent-vault.in/dashboard/recruiter/
      # Shared secret for the TalentVault Admin Portal -> HireNest employer
      # approvals integration. Must match TalentVault's HIRENEST_ADMIN_API_KEY.
      - key: HIRENEST_ADMIN_API_KEY
        sync: false
