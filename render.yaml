databases:
  # Dedicated HireNest Australia database — completely separate from TalentVault.
  - name: hirenest-australia-db
    databaseName: hirenest_australia
    user: hirenest_user
    plan: starter

services:
  - type: web
    name: hirenest-australia
    runtime: python
    plan: starter
    buildCommand: ./build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: SITE_URL
        value: https://hirenest.com.au
      - key: SITE_NAME
        value: HireNest Australia
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # HireNest uses its OWN database connection string. It must NOT reuse
      # TalentVault's DATABASE_URL.
      - key: HIRENEST_DATABASE_URL
        fromDatabase:
          name: hirenest-australia-db
          property: connectionString
      - key: TALENTVAULT_RECRUITER_WORKSPACE_URL
        value: https://talent-vault.in/dashboard/recruiter/
